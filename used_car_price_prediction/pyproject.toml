[project]
name = "used-car-price-prediction"
version = "0.1.0"
description = "Django application for used car resale price prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "reportlab>=4.2",
    "requests>=2.32",
]

[tool.uv]
package = false
